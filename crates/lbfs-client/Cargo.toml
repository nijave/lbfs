[package]
name = "lbfs-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lbfs-proto = { workspace = true, features = ["io"] }
serde = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
fuser = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
# The multiplexer's live suite runs a real server in process: `lbfs-server` is
# a dev-dependency rather than a dependency because nothing the client ships
# links it. Task 16's loopback test needs the same pair.
lbfs-server = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
