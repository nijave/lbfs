[package]
name = "lbfs-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mounts a remote lbfs export over FUSE"

[dependencies]
lbfs-proto = { workspace = true, features = ["io"] }
serde = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
fuser = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
# The multiplexer's live suite runs a real server in process: `lbfs-server` is
# a dev-dependency rather than a dependency because nothing the client ships
# links it. Task 16's loopback test needs the same pair.
lbfs-server = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Nick Venenga <nick@venenga.com>"
section = "utils"
# `fuse3` has to be named here, and `$auto` cannot find it. Since fuser 0.16.0
# the client links no FUSE library at all — it mounts through the crate's
# pure-Rust path — so dpkg-shlibdeps reads the ELF and sees only libc. What the
# ELF cannot show is the program that path execs: `fusermount3` and
# `/etc/fuse.conf` ship in `fuse3`, and an unprivileged mount,
# `--allow-other`, and `--auto-unmount` each need them.
depends = "fuse3, $auto"
assets = [["target/release/lbfs-client", "usr/bin/", "755"]]
