[package]
name = "lbfs-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mounts a remote lbfs export over FUSE"

[dependencies]
lbfs-proto = { workspace = true, features = ["io"] }
serde = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
fuser = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
# The multiplexer's live suite runs a real server in process: `lbfs-server` is
# a dev-dependency rather than a dependency because nothing the client ships
# links it. Task 16's loopback test needs the same pair.
lbfs-server = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Nick Venenga <nick@venenga.com>"
section = "utils"
# `fuse3`, not `libfuse3-3`. `$auto` runs dpkg-shlibdeps over the ELF, so the
# library fuser links — `libfuse3.so.3` — is already covered and naming it here
# adds nothing. What the ELF cannot show is the helper libfuse execs:
# `fusermount3` and `/etc/fuse.conf` ship in `fuse3`, and an unprivileged
# mount, `--allow-other`, and `--auto-unmount` each need them. `fuse3` depends
# on `libfuse3-3`, so the library still arrives.
depends = "fuse3, $auto"
assets = [["target/release/lbfs-client", "usr/bin/", "755"]]
