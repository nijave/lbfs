[package]
name = "lbfs-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Exports a local directory over the lbfs network protocol, served with io_uring"

[dependencies]
lbfs-proto = { workspace = true, features = ["io"] }
serde = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
io-uring = { workspace = true }
rustix = { workspace = true }
libc = { workspace = true }
globset = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Nick Venenga <nick@venenga.com>"
section = "admin"
# `adduser` is not essential, and `postinst` calls it to create `_lbfs`. Only
# the linked libraries come from `$auto`, which reads the ELF and so cannot see
# a program a shell script execs.
depends = "adduser, $auto"
assets = [
    ["target/release/lbfs-server", "usr/bin/", "755"],
    # `pkg/lbfs.toml`, not `vm/server-config.toml`: the VM harness fixture is
    # edited to suit whatever a test needs, and it should not be able to change
    # what every installed package defaults to.
    ["pkg/lbfs.toml", "etc/lbfs.toml", "644"],
]
conf-files = ["/etc/lbfs.toml"]
maintainer-scripts = "pkg/maintainer-scripts"
systemd-units = { enable = true, unit-scripts = "pkg" }
