listen = "0.0.0.0:9423"
allowed_paths = ["/srv/exports/*"]
fsync = "honor"
# How long a session outlives its socket, so a client can RESUME it after a
# transport failure. "0" turns retention off entirely.
resume_grace = "60s"
# How many sessions may hold a resume ticket at once; past the cap, ATTACH
# still succeeds and simply mints no ticket.
max_resumable_sessions = 64
