[workspace]
resolver = "2"
members = ["crates/lbfs-proto", "crates/lbfs-server", "crates/lbfs-client", "tests"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lbfs-proto = { path = "crates/lbfs-proto" }
lbfs-server = { path = "crates/lbfs-server" }
lbfs-client = { path = "crates/lbfs-client" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
io-uring = "0.7"
# `thread` is here for `capabilities()`: the server reads its own CAP_FSETID
# once at startup to learn whether the backing kernel will strip set-user-ID
# on its behalf. See `fs::local::killpriv`.
rustix = { version = "1", features = ["event", "fs", "net", "process", "thread"] }
libc = "0.2"
globset = "0.4"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# The ABI level is a claim about what this client understands, and fuser gates
# its own constants on it. Every kernel-cache knob spec §7 asks for lives above
# the 7.8 default: `FUSE_DO_READDIRPLUS`/`FUSE_READDIRPLUS_AUTO` are 7.21,
# `FUSE_WRITEBACK_CACHE` is 7.23, `batch_forget` is 7.16, and `max_pages` (what
# carries a negotiated `max_write` past 128 KiB) is 7.28. 7.40 is the highest
# level 0.16.0 offers, and it costs nothing above 7.31 today: the release names
# no constant between bits 26 and 36, and a feature nobody asks for is one the
# kernel leaves off. `the_only_high_capability_asked_for_is_killpriv_v2` in
# `fuse.rs` is what keeps that true. The kernel negotiates down to whatever it
# supports, so asking for 7.40 costs nothing on an older one.
#
# `libfuse` is deliberately absent from the feature list. 0.16.0 made it opt-in
# (`default = []`), and leaving it off selects fuser's pure-Rust mount, which
# runs `fusermount3` instead of linking `libfuse3.so`. See README "Why a
# container and not a musl target".
fuser = { version = "=0.17.0", features = ["abi-7-40"] }
proptest = "1"
tempfile = "3"
futures = "0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[workspace.lints.rust]
# Denied here so every crate root - including future test, bench, and example
# roots - is covered automatically. Every existing crate root repeats
# `#![deny(unsafe_code)]` so the rule is visible where it is read. `deny` is
# overridable, which is the point: lbfs-server re-allows it for exactly one
# module (`fs::local::uring`), the only place `unsafe` may appear.
unsafe_code = "deny"
