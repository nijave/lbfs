[workspace]
resolver = "2"
members = ["crates/lbfs-proto", "crates/lbfs-server", "crates/lbfs-client", "tests"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lbfs-proto = { path = "crates/lbfs-proto" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
io-uring = "0.7"
rustix = { version = "1", features = ["event", "fs", "net", "process"] }
libc = "0.2"
globset = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
fuser = "0.15"
proptest = "1"
tempfile = "3"
futures = "0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[workspace.lints.rust]
# Denied here so every crate root - including future test, bench, and example
# roots - is covered automatically. Every existing crate root repeats
# `#![deny(unsafe_code)]` so the rule is visible where it is read. `deny` is
# overridable, which is the point: lbfs-server re-allows it for exactly one
# module (`fs::local::uring`), the only place `unsafe` may appear.
unsafe_code = "deny"
