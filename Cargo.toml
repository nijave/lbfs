[workspace]
resolver = "2"
members = ["crates/lbfs-proto", "crates/lbfs-server", "crates/lbfs-client", "tests"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lbfs-proto = { path = "crates/lbfs-proto" }
lbfs-server = { path = "crates/lbfs-server" }
lbfs-client = { path = "crates/lbfs-client" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# `default-features = false` is what keeps `heapless 0.7` — and through it the
# unmaintained `atomic-polyfill` (RUSTSEC-2023-0089) — out of the lockfile.
# The default `heapless-cas` feature exists for embedded callers serializing
# into `heapless::Vec`; this workspace only ever calls `to_allocvec` and
# `from_bytes`, which is the `alloc` feature.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
io-uring = "0.7"
# `thread` is here for `capabilities()`: the server reads its own CAP_FSETID
# once at startup to learn whether the backing kernel will strip set-user-ID
# on its behalf. See `fs::local::killpriv`.
rustix = { version = "1", features = ["event", "fs", "net", "process", "thread"] }
libc = "0.2"
globset = "0.4"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Pinned exactly, never as a range. Releases after 0.18.0 come primarily from a
# coding agent under, in the maintainer's own words, "at least a cursory review
# from a human", and for a filesystem client a protocol bug is a data bug. Read
# the diff before moving this number; see the governance section and the
# pre-bump addendum in `docs/notes/2026-08-22-fuser-upgrade-assessment.md`.
#
# The `abi-7-*` features are gone as of this release — the ABI level is 7.40,
# fixed, with compatibility settled at run time against what the kernel offers.
# `libfuse` stays off, which selects the crate's pure-Rust mount: it runs
# `fusermount3` as a child process instead of linking `libfuse3.so`.
fuser = { version = "=0.18.0" }
proptest = "1"
tempfile = "3"
futures = "0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[workspace.lints.rust]
# Denied here so every crate root - including future test, bench, and example
# roots - is covered automatically. Every existing crate root repeats
# `#![deny(unsafe_code)]` so the rule is visible where it is read. `deny` is
# overridable, which is the point: lbfs-server re-allows it for exactly one
# module (`fs::local::uring`), the only place `unsafe` may appear.
unsafe_code = "deny"
