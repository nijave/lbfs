[workspace]
resolver = "2"
members = ["crates/lbfs-proto", "crates/lbfs-server", "crates/lbfs-client", "tests"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lbfs-proto = { path = "crates/lbfs-proto" }
lbfs-server = { path = "crates/lbfs-server" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
io-uring = "0.7"
rustix = { version = "1", features = ["event", "fs", "net", "process"] }
libc = "0.2"
globset = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# `abi-7-31` is not a nicety. fuser gates its FUSE features on the ABI level it
# claims, and every kernel-cache knob spec §7 asks for lives above the 7.8
# default: `FUSE_DO_READDIRPLUS`/`FUSE_READDIRPLUS_AUTO` are 7.21,
# `FUSE_WRITEBACK_CACHE` is 7.23, `batch_forget` is 7.16, and `max_pages` (what
# carries a negotiated `max_write` past 128 KiB) is 7.28. Without the feature
# those constants and callbacks are not compiled at all. The kernel still
# negotiates down to whatever it supports, so asking for 7.31 costs nothing on
# an older one.
fuser = { version = "0.15", features = ["abi-7-31"] }
proptest = "1"
tempfile = "3"
futures = "0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[workspace.lints.rust]
# Denied here so every crate root - including future test, bench, and example
# roots - is covered automatically. Every existing crate root repeats
# `#![deny(unsafe_code)]` so the rule is visible where it is read. `deny` is
# overridable, which is the point: lbfs-server re-allows it for exactly one
# module (`fs::local::uring`), the only place `unsafe` may appear.
unsafe_code = "deny"
