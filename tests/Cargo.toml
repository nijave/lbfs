[package]
name = "lbfs-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The harness in `src/lib.rs` starts a real server and speaks frames to it, so
# the server and the protocol are ordinary dependencies rather than dev ones:
# a dev-dependency is not visible to a crate's own library target.
[dependencies]
lbfs-proto = { workspace = true, features = ["io"] }
lbfs-server = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
rustix = { workspace = true }
# The loopback suite mounts the real client over a real server. Both are
# dev-dependencies rather than dependencies of the harness library: `src/lib.rs`
# speaks frames and knows nothing about FUSE, and a test target sees a crate's
# dev-dependencies, so nothing is gained by widening the library's own graph.
lbfs-client = { workspace = true }
fuser = { workspace = true }

[lints]
workspace = true
