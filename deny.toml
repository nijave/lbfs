# No ignore list, on purpose: the two advisories that ever fired here were
# both cleared at the root. RUSTSEC-2021-0154 fell to pinning fuser at a
# patched release, and RUSTSEC-2023-0089 fell to dropping postcard's default
# `heapless-cas` feature (see the comment on the pin in `Cargo.toml`). Prefer
# that shape for the next one too: an entry here is a standing suppression
# somebody has to remember to revisit.

[advisories]
version = 2
yanked = "deny"
