name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # fuser's build script links libfuse via pkg-config, so even
      # check-only builds need its development headers.
      - name: Install libfuse3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Disabled until the fuser package upgrade is merged; re-enable then.
  # audit:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: EmbarkStudios/cargo-deny-action@v2
  #       with:
  #         command: check advisories

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libfuse3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - name: Build release binaries
        run: cargo build --release -p lbfs-server -p lbfs-client

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lbfs-binaries
          path: |
            target/release/lbfs-server
            target/release/lbfs-client
          if-no-files-found: error
